<header class="top-nav">
  <a class="brand" routerLink="/">
    <img class="brand-mark" src="/brand-logo.png" width="52" height="52" alt="" />
    <span class="brand-copy">
      <span class="brand-kicker">Your travel portal</span>
      <span class="brand-name">Your Next Travel</span>
    </span>
  </a>
  <nav class="top-nav-links">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Explore</a>
    @if (auth.signedIn()) {
      <a routerLink="/dashboard" routerLinkActive="is-active">Dashboard</a>
      <a routerLink="/trip-journal" routerLinkActive="is-active">My Trips Journal</a>
      <a routerLink="/plan" routerLinkActive="is-active">Plan a trip</a>
      <a routerLink="/preferences" routerLinkActive="is-active">Preferences</a>
      <a routerLink="/account" routerLinkActive="is-active">Account</a>
      <span class="top-nav-user">{{ auth.user()?.display_name || auth.user()?.email }}</span>
      <button type="button" class="ghost-btn" (click)="signout()">Sign out</button>
    } @else {
      <a class="ghost-link" routerLink="/signin" routerLinkActive="is-active">Sign in</a>
      <a class="cta-link" routerLink="/signup">Create a free account</a>
    }
  </nav>
</header>
