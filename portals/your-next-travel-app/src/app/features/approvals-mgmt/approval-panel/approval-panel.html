<section class="approval-section">
  <div class="approval-icon">👤</div>
  <div class="approval-content">
    <span class="eyebrow">Human-in-the-Loop</span>
    <h2>Review the draft itinerary</h2>
    <p>{{ message || 'Approve the draft or provide feedback before the final plan is generated.' }}</p>
    <textarea
      class="feedback-input"
      [ngModel]="feedback"
      (ngModelChange)="onFeedback($event)"
      placeholder="Add revision feedback..."
    ></textarea>
    <div class="approval-actions">
      <button class="approve-btn" type="button" [disabled]="loading" (click)="submit(true)">
        Approve & Generate Final
      </button>
      <button class="revise-btn" type="button" [disabled]="loading" (click)="submit(false)">
        Revise Using Feedback
      </button>
    </div>
  </div>
</section>
