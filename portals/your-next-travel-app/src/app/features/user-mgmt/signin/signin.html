<section class="auth-card">
  <p class="kicker">Welcome back</p>
  <h1>Sign in</h1>
  <p>Save trips, set preferences, and pick up a draft itinerary.</p>
  <form class="auth-form" (ngSubmit)="submit()">
    <label>
      <span>Email</span>
      <input name="email" type="email" [(ngModel)]="email" autocomplete="email" required />
    </label>
    <label>
      <span>Password</span>
      <input name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required />
    </label>
    <button class="btn-accent" type="submit">Sign in</button>
    @if (error()) {
      <p class="auth-error">{{ error() }}</p>
    }
  </form>
  <p class="auth-switch">Need an account? <a routerLink="/signup">Create a free account</a></p>
</section>
