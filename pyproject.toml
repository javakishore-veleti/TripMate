[project]
name = "your-next-travel"
version = "0.1.0"
description = "Your Next Travel — multi-agent travel planner API"
requires-python = ">=3.12"
dependencies = [
    "airportsdata==20260315",
    "alembic>=1.16.0",
    "certifi==2026.6.17",
    "fastapi==0.136.3",
    "jinja2==3.1.6",
    "langchain==1.3.2",
    "langchain-community==0.4.2",
    "langchain-groq==1.1.3",
    "langchain-mcp-adapters==0.3.0",
    "langchain-tavily==0.2.18",
    "langgraph==1.2.2",
    "langgraph-checkpoint-postgres==3.1.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "mcp==1.28.1",
    "nest-asyncio==1.6.0",
    "overrides==7.7.0",
    "psycopg-pool==3.3.1",
    "psycopg[binary]==3.3.4",
    "pycountry==26.2.16",
    "pyjwt>=2.13.0",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "sqlalchemy>=2.0.43",
    "tavily-python==0.7.24",
    "uvicorn==0.48.0",
]

[project.scripts]
your-next-travel = "middleware.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["middleware"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
